<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Caisse Prestapay — Connexion</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo">
            <img src="logo.png" alt="My Caisse Prestapay" id="logoImg">
        </div>

        <h1 class="login-title">My Caisse</h1>

        <div class="login-subtitle">
            <span class="line"></span>
            <span class="text">Prestapay</span>
            <span class="line"></span>
        </div>

        <p class="login-version">Version 2.4.0</p>

        <form id="loginForm">
            <div class="field">
                <span class="field-icon">👤</span>
                <input type="text" id="username" placeholder="Yahya" required>
            </div>

            <div class="field">
                <span class="field-icon">🔒</span>
                <input type="password" id="password" required>
                <button type="button" class="toggle-pass" id="togglePass">👁</button>
            </div>

            <div class="row-between">
                <label class="checkbox">
                    <input type="checkbox" id="remember">
                    <span class="checkmark"></span>
                    <span>Se souvenir de moi</span>
                </label>
                <a href="#" class="forgot" id="forgotLink">Mot de passe oublié ?</a>
            </div>

            <p class="login-error" id="loginError"></p>

            <button type="submit" class="btn-primary" id="loginBtn">
                <span>🔐</span> Se connecter
            </button>

            <div class="secure-badge">
                <span class="shield">🛡</span>
                <span>Accès sécurisé</span>
            </div>
        </form>
    </div>

    <div class="wave-bg"></div>

    <div class="login-footer">
        <p>Votre gestion de caisse,<br>plus simple et plus sûre !</p>
    </div>

    <div class="toast" id="toast"></div>

<script>
const FALLBACK_LOGO = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
<stop offset='0' stop-color='%238B5CF6'/><stop offset='1' stop-color='%231E3A8A'/>
</linearGradient></defs>
<rect x='10' y='10' width='80' height='80' rx='20' fill='url(%23g)'/>
<path d='M35 72V28h18a14 14 0 0 1 0 28h-8v16z' fill='white'/>
<circle cx='53' cy='42' r='6' fill='%231E3A8A'/>
</svg>`;

const logoEl = document.getElementById('logoImg');
logoEl.onerror = () => { logoEl.onerror = null; logoEl.src = FALLBACK_LOGO; };

const passEl = document.getElementById('password');
document.getElementById('togglePass').onclick = () => {
    passEl.type = passEl.type === 'password' ? 'text' : 'password';
};

function toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.className = 'toast ' + type, 3000);
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim().toUpperCase();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    errEl.textContent = '';

    if (!username || !password) {
        errEl.textContent = 'Veuillez remplir tous les champs.';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Connexion...';

    try {
        let user = null;

        if (CONFIG.LOCAL_MODE) {
            const u = CONFIG.LOCAL_USERS[username];
            if (u && u.password === password) {
                user = { username, role: u.role, permissions: u.permissions };
            }
        } else {
            const params = new URLSearchParams({ action: 'login', username, password });
            const res = await fetch(CONFIG.API_URL + '?' + params.toString(), {
                method: 'GET',
                redirect: 'follow'
            });
            const data = await res.json();
            if (data.success) {
                user = data.user;
                sessionStorage.setItem('mycaisse_token', data.token);
            } else {
                errEl.textContent = data.error || 'Erreur';
                passEl.value = '';
                passEl.focus();
                return;
            }
        }

        if (!user) {
            errEl.textContent = 'Identifiants incorrects.';
            passEl.value = '';
            passEl.focus();
            return;
        }

        const session = {
            username: user.username,
            role: user.role,
            permissions: user.permissions,
            loginAt: Date.now(),
            remember,
            expires: remember ? Date.now() + 30 * 24 * 3600 * 1000 : 0
        };
        localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(session));

        if (remember) localStorage.setItem('mycaisse_remember_user', username);
        else localStorage.removeItem('mycaisse_remember_user');

        toast('Connexion réussie', 'success');
        setTimeout(() => window.location.href = 'app.html', 600);

    } catch (err) {
        console.error(err);
        errEl.textContent = 'Erreur de connexion.';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🔐</span> Se connecter';
    }
});

(function autoFill() {
    const remembered = localStorage.getItem('mycaisse_remember_user');
    if (remembered) {
        document.getElementById('username').value = remembered;
        document.getElementById('remember').checked = true;
        document.getElementById('password').focus();
    }
})();

document.getElementById('forgotLink').onclick = (e) => {
    e.preventDefault();
    toast('Contactez l\'administrateur.', 'warn');
};
</script>
</body>
</html>
